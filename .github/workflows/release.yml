name: Build and publish Windows update

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_VERSION: 1.6.0-beta
  RELEASE_TAG: v1.6.0-beta
  PACKAGE_NAME: naiba-chat-1.6.0-beta-windows-x64

concurrency:
  group: naiba-chat-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pyinstaller pywebview pystray "mcp==2.1.1"
          python -m pip install --disable-pip-version-check --upgrade --force-reinstall --no-cache-dir pillow
          python -c "from PIL import Image; print('Pillow', Image.__version__)"

      - name: Run tests
        shell: pwsh
        run: |
          if (-not (Test-Path "tests")) {
            Write-Host "tests directory not found; skipping unit tests."
            exit 0
          }
          $attempts = 2
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            python -m unittest discover -s tests -v
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            if ($attempt -lt $attempts) {
              Write-Host "Tests failed on attempt $attempt; retrying once."
            }
          }
          exit 1

      - name: Build executable
        shell: pwsh
        run: |
          $env:NAIBA_BUILD_COMMIT = "${{ github.sha }}"
          $env:NAIBA_BUILD_VERSION = "${{ env.RELEASE_VERSION }}"
          python -m PyInstaller --noconfirm --clean naiba-chat.spec

      - name: Create update manifest
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 dist\naiba-chat.exe).Hash.ToLowerInvariant()
          $releaseNotes = @(Get-Content -Raw -Encoding UTF8 release_notes.json | ConvertFrom-Json)
          $manifest = [ordered]@{
            repository = "yc883123/naiba-chat"
            version = "${{ env.RELEASE_VERSION }}"
            commit = "${{ github.sha }}"
            asset = "naiba-chat.exe"
            sha256 = $hash
            published_at = (Get-Date).ToUniversalTime().ToString("o")
            release_notes = $releaseNotes
          }
          $manifest | ConvertTo-Json | Set-Content -Encoding UTF8 naiba-chat-update.json

      - name: Create Windows package
        shell: pwsh
        run: |
          $packageDir = Join-Path "dist" "${{ env.PACKAGE_NAME }}"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          Copy-Item -LiteralPath "dist\naiba-chat.exe" -Destination $packageDir
          Copy-Item -LiteralPath "naiba-chat-update.json" -Destination $packageDir
          Copy-Item -LiteralPath "README.md" -Destination $packageDir
          Compress-Archive -Path "$packageDir\*" -DestinationPath "dist\${{ env.PACKAGE_NAME }}.zip" -Force

      - name: Publish 1.6.0 Beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Naiba Chat 1.6.0 Beta
          prerelease: false
          make_latest: true
          files: |
            dist/naiba-chat.exe
            dist/${{ env.PACKAGE_NAME }}.zip
            naiba-chat-update.json
          body: |
            Naiba Chat 1.6.0 Beta Windows build from `${{ github.sha }}`.

            本次更新：
            - 缓存优化：图片对话历史改为「每条 user 消息独立携带自己的完整图片、稳定重发」，不再按「只保留最近图片/翻转占位」选择，避免缓存命中率忽高忽低；图片以 content 块（image_url / input_image）发送，不把 base64 当文本，命中率随对话稳定上涨。
            - 切换 Agent：切换顶部 Agent 后自动在输入框末尾追加该 Agent 预设 Skill 的 /ref 引用（已在框内的跳过，避免重复）。
            - 移除调试：关闭缓存诊断日志（默认不打印；设 CACHE_DEBUG_ON=True 或 NAIBA_DEBUG_CACHE=1 可开启）。
            - Skill 系统重构：支持在任意时刻输入 / 弹出已安装 Skill 索引，选择即可向当前会话注入任意 Skill（/ref 引用）；引用在首轮注入 system、后续轮追加到会话末尾，保持 DeepSeek 前缀缓存稳定。
            - 安装/编辑 Skill：新增「安装 Skill」「编辑 Skill」，AI 可调用 install_skill / unpack_skill_archive 安装技能，或用 inspect_installed_skill 定位并编辑已有技能。
            - 左侧边栏：会话列表改为虚拟化/懒加载、默认折叠、可拖拽调宽，交互更轻量清晰。
            - 流式输出：修复模型输出含大括号/方括号代码块（如 Java/C/JS 的大括号 `{ }`、`[Shot 1]` 标签）时，后端误把这类正文当作工具调用协议、停止推送流式增量，导致前端显示卡住、要等整段输出完才完整渲染的问题；现在按普通文本实时推送，多个代码块随内容同步渲染。
            - 流式输出：修复长答复（如 MiniMax H3 多段提示词）在 `assistant_response` / `run_completed` 事件中被截断到 2000 字符、丢失结尾段落的问题；现在完整下发。
            - Markdown 渲染：修复 `**a * b**` 这类包含字面星号的加粗无法渲染的问题。
            - Markdown 表格：新增表格渲染支持（`| 列 | 列 |` + `| --- | --- |`），流式时随内容逐行增长，单元格支持加粗/内联代码/链接，含 `|` 的内联代码与 `\|` 转义竖线不会被切碎。

            The application verifies `naiba-chat.exe` against the SHA-256 value
            in `naiba-chat-update.json` before installing an update.
