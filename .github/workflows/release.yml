name: Build and publish Windows update

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_VERSION: 2.0.0-beta
  RELEASE_TAG: v2.0.0-beta
  PACKAGE_NAME: naiba-chat-2.0.0-beta-windows-x64

concurrency:
  group: naiba-chat-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pyinstaller pywebview pystray "mcp==2.1.1"
          python -m pip install --disable-pip-version-check --upgrade --force-reinstall --no-cache-dir pillow
          python -c "from PIL import Image; print('Pillow', Image.__version__)"

      - name: Run tests
        shell: pwsh
        run: |
          if (-not (Test-Path "tests")) {
            Write-Host "tests directory not found; skipping unit tests."
            exit 0
          }
          $attempts = 2
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            python -m unittest discover -s tests -v
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            if ($attempt -lt $attempts) {
              Write-Host "Tests failed on attempt $attempt; retrying once."
            }
          }
          exit 1

      - name: Build executable
        shell: pwsh
        run: |
          $env:NAIBA_BUILD_COMMIT = "${{ github.sha }}"
          $env:NAIBA_BUILD_VERSION = "${{ env.RELEASE_VERSION }}"
          python -m PyInstaller --noconfirm --clean naiba-chat.spec

      - name: Create update manifest
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 dist\naiba-chat.exe).Hash.ToLowerInvariant()
          $releaseNotes = @(Get-Content -Raw -Encoding UTF8 release_notes.json | ConvertFrom-Json)
          $manifest = [ordered]@{
            repository = "yc883123/naiba-chat"
            version = "${{ env.RELEASE_VERSION }}"
            commit = "${{ github.sha }}"
            asset = "naiba-chat.exe"
            sha256 = $hash
            published_at = (Get-Date).ToUniversalTime().ToString("o")
            release_notes = $releaseNotes
          }
          $manifest | ConvertTo-Json | Set-Content -Encoding UTF8 naiba-chat-update.json

      - name: Create Windows package
        shell: pwsh
        run: |
          $packageDir = Join-Path "dist" "${{ env.PACKAGE_NAME }}"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          Copy-Item -LiteralPath "dist\naiba-chat.exe" -Destination $packageDir
          Copy-Item -LiteralPath "naiba-chat-update.json" -Destination $packageDir
          Copy-Item -LiteralPath "README.md" -Destination $packageDir
          Compress-Archive -Path "$packageDir\*" -DestinationPath "dist\${{ env.PACKAGE_NAME }}.zip" -Force

      - name: Publish 2.0.0 Beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Naiba Chat 2.0.0 Beta
          prerelease: false
          make_latest: true
          files: |
            dist/naiba-chat.exe
            dist/${{ env.PACKAGE_NAME }}.zip
            naiba-chat-update.json
          body: |
            Naiba Chat 2.0.0 Beta Windows build from `${{ github.sha }}`.

            本次更新（完整清单见 `release_notes.json` / 应用内「更新说明」）：
            - 上下文用量提醒：圆环随每次模型请求刷新，达「运行设置 → 上下文提醒阈值」（默认 80%，0=关闭）时弹窗——运行中即时弹、已结束会话改为点发送才弹（可「继续发送」），距上次提醒再涨 5% 才再提醒。
            - 在线模型 5xx 自动重试：不再直接终止整轮，按瞬时故障退避重试（最多 3 次）并提示重试进度；失败请求体落盘取证（截断、不含 API Key）。
            - 设置页卡片化：API 供应商与 Agent 管理改为卡片网格 + 点开弹层编辑；四个内置 Agent 预设（dsh-*）下线。
            - Agent ID 由后台自动分配（不再手填），Agent 支持自定义头像（自动中心裁切，替换会话里的「AI」圆标）。
            - 工具与 Skill 选择器改版：固定 Skill 卡片化并与工具集等高、工具集分组一行呈现、展开卡片更紧凑、修复列表被裁成一条线。
            - 设置页文本框右键菜单恢复（撤销/重做/剪切/复制/粘贴/删除/全选），不再被模态弹层盖住或误弹会话页菜单。
            - 会话页新增「对话刻度轨」：每轮一条横条、滚动时当前轮加粗、悬停看概要、点击跳转。
            - 多媒体显示改造：工具产出的图片/视频/音频紧跟产生它的那次工具调用就地显示，支持 Range 播放、GIF 首帧缩略图，后台任务（ComfyUI 等）产物自动挂回发起它的消息。
            - 会话收藏与侧栏交互：五角星收藏 + 跨工作区「已收藏」分组，重命名/删除并入「⋯」菜单；滚动更顺滑、条目更紧凑、点击会话不再强制置顶。
            - 会话级系统提示词退役：系统提示词统一由 Agent 决定，角色卡导入与快捷提示词套用迁到 Agent 设置页。
            - 顶栏与输入区精简：任务/Skill 计数改为数字文本、MCP 只看状态点颜色；待发送附件改为固定高度的竖直列表（文件名截断、图片预览）。
            - 稳定性与守门：544 个单元/契约测试 + golden 回放 3 基线 + 真机浏览器冒烟（含本次新增的上下文圆环/提醒 23 项断言）全通过。

            The application verifies `naiba-chat.exe` against the SHA-256 value
            in `naiba-chat-update.json` before installing an update.
