name: Build and publish Windows update

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naiba-chat-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check pyinstaller pywebview pystray pillow "mcp>=1.2.0,<2"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build executable
        shell: pwsh
        run: |
          $env:NAIBA_BUILD_COMMIT = "${{ github.sha }}"
          $env:NAIBA_BUILD_VERSION = "build-${{ github.run_number }}"
          python -m PyInstaller --noconfirm --clean naiba-chat.spec

      - name: Create update manifest
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 dist\naiba-chat.exe).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            repository = "yc883123/naiba-chat"
            version = "build-${{ github.run_number }}"
            commit = "${{ github.sha }}"
            asset = "naiba-chat.exe"
            sha256 = $hash
            published_at = (Get-Date).ToUniversalTime().ToString("o")
            release_notes = @(
              "修复：切换 Agent 后，对话页 Skill 数量与勾选状态未同步显示 Agent 固定 Skill。",
              "前端：Skill 弹窗与顶部计数现在合并当前 Agent 的固定 Skill，并标记「Agent 固定」且不可取消勾选。",
              "前端：切换 Agent、新建或打开对话后即时刷新 Skill 显示状态。"
            )
          }
          $manifest | ConvertTo-Json | Set-Content -Encoding UTF8 naiba-chat-update.json

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Automatic build ${{ github.run_number }}
          prerelease: false
          make_latest: true
          files: |
            dist/naiba-chat.exe
            naiba-chat-update.json
          body: |
            Automatic Windows build from `${{ github.sha }}`.
            The application verifies the SHA-256 manifest before installing.
